<style>
:root {
  /* Dark Luxury Cyber Theme Palette */
  --bg: #090a0f;
  --bg2: #121420;
  --bg3: #1a1d2f;
  --bg4: #24283f;
  --glass: rgba(18, 20, 32, 0.7);
  --glass-border: rgba(255, 255, 255, 0.06);
  
  /* Neon Premium Accents */
  --primary-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
  --gold-gradient: linear-gradient(135deg, #F9D423 0%, #FF4E50 100%);
  --green: #00F5A0;
  --green-glow: rgba(0, 245, 160, 0.15);
  --red: #FF3366;
  --red-glow: rgba(255, 51, 102, 0.15);
  
  /* Text & Typography */
  --text: #F3F4F6;
  --text2: #9CA3AF;
  --text3: #6B7280;
  
  /* Radius */
  --radius-sm: 14px;
  --radius: 20px;
  --radius-lg: 28px;
  
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.1);
  --shadow-glow: 0 8px 32px rgba(0, 242, 254, 0.15);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

/* Background Ambient Glows */
body::before {
  content: '';
  position: absolute;
  top: -10%;
  left: -20%;
  width: 300px;
  height: 300px;
  background: #00f2fe;
  filter: blur(120px);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: absolute;
  bottom: 10%;
  right: -20%;
  width: 300px;
  height: 300px;
  background: #ff3366;
  filter: blur(120px);
  opacity: 0.08;
  pointer-events: none;
  z-index: 0;
}

body {
  display: flex;
  flex-direction: column;
  max-width: 460px;
  margin: 0 auto;
  position: relative;
  background-color: var(--bg);
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
  border-left: 1px solid var(--glass-border);
  border-right: 1px solid var(--glass-border);
}

/* HEADER */
.header {
  padding: 48px 24px 16px;
  position: relative;
  z-index: 10;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.app-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}
.app-name span {
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.month-nav {
  display: flex;
  align-items: center;
  background: var(--bg2);
  border: 1px solid var(--glass-border);
  padding: 4px;
  border-radius: 12px;
}
.month-btn {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.month-btn:hover {
  background: var(--bg3);
  color: var(--text);
}
.month-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  min-width: 100px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* PREMIUM BALANCE CARD */
.balance-card {
  background: #111424;
  background-image: radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(79, 172, 254, 0.15) 0px, transparent 50%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin: 0 24px 12px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.balance-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}
.balance-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.balance-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -1px;
  color: #fff;
  margin-bottom: 20px;
}
.balance-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.balance-sub {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.balance-sub-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.balance-sub-val {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}
#header-in { color: var(--green); }
#header-out { color: var(--red); }

/* TABS */
.tabs {
  display: flex;
  background: var(--bg2);
  margin: 8px 24px;
  padding: 4px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text2);
  border: none;
  background: transparent;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.tab.active {
  background: var(--bg3);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), var(--shadow-sm);
  font-weight: 600;
}

/* CONTENT CONTAINER */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 24px 100px;
  position: relative;
  z-index: 1;
}
.content::-webkit-scrollbar { display: none; }

/* SECTION TITLES */
.section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 20px 0 12px;
}

/* TRANSACTION ITEMS */
.tx-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  transition: transform 0.2s, background 0.2s;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.tx-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.tx-icon.in { background: var(--green-glow); border: 1px solid rgba(0, 245, 160, 0.2); }
.tx-icon.out { background: var(--red-glow); border: 1px solid rgba(255, 51, 102, 0.2); }

.tx-info { flex: 1; min-width: 0; }
.tx-cat { font-size: 14px; font-weight: 600; color: var(--text); }
.tx-note { font-size: 12px; color: var(--text2); margin-top: 2px; }

.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
.tx-amount.in { color: var(--green); }
.tx-amount.out { color: var(--red); }
.tx-del {
  background: none; border: none; color: var(--text3);
  cursor: pointer; font-size: 14px; padding: 4px;
  margin-top: 4px; margin-left: auto; display: block;
}
.tx-del:hover { color: var(--red); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state .emoji { font-size: 54px; margin-bottom: 16px; opacity: 0.5; }

/* CHARTS & STATS CARDS */
.chart-wrap {
  background: var(--bg2);
  border-radius: var(--radius-lg);
  padding: 20px;
  border: 1px solid var(--glass-border);
  margin-bottom: 12px;
}
.chart-legend { display: flex; gap: 16px; margin-bottom: 16px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.bar-day { margin-bottom: 14px; }
.bar-day-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; }
.bar-row { display: flex; align-items: center; gap: 10px; height: 8px; margin-bottom: 4px; }
.bar-track { flex: 1; background: var(--bg3); border-radius: 99px; height: 100%; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.bar-in { background: var(--primary-gradient); }
.bar-out { background: linear-gradient(90deg, #FF3366, #FF6B6B); }
.bar-val { font-size: 10px; color: var(--text3); width: 55px; text-align: right; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 16px;
}
.stat-card-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-card-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; }
.stat-card-val.pos { color: var(--green); }
.stat-card-val.neg { color: var(--red); }
